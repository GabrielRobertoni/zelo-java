# Configuracao padrao: H2 embutido criado e populado pelo Flyway. Ao iniciar,
# a SelecaoDeBanco tenta o Oracle do grupo e, se ele responder, liga o perfil
# "oracle" sozinha. Sem Oracle, a aplicacao roda normalmente com o H2.
spring:
  application:
    name: zelo-java
  datasource:
    url: "jdbc:h2:mem:zelodb;MODE=Oracle;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration/h2
  thymeleaf:
    cache: true
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 60m

management:
  endpoints:
    web:
      exposure:
        include: health

zelo:
  api:
    jwt-secret: ${ZELO_JWT_SECRET:zelo-chave-local-de-desenvolvimento-com-mais-de-32-bytes}
    jwt-validade-horas: 168

---
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Perfil oracle: instancia Oracle do grupo, cujo schema principal e criado pelo
# script da disciplina de Banco de Dados. Os dados de conexao vem da
# SelecaoDeBanco (padrao do grupo ou variaveis ORACLE_URL/USER/PASSWORD).
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${zelo.oracle.url}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${zelo.oracle.usuario}
    password: ${zelo.oracle.senha}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
  flyway:
    locations: classpath:db/migration/oracle
    baseline-on-migrate: true
    baseline-version: "0"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: "jdbc:h2:mem:zelodb-test-${random.uuid};MODE=Oracle;DB_CLOSE_DELAY=-1"
