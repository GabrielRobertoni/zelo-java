<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Minha clínica</title></head>
<body>
<main layout:fragment="conteudo" class="container pagina-media">
    <ul th:replace="~{fragments/componentes :: abasGestor('dados')}"></ul>
    <div class="card card-zelo p-4 mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
                <h1 class="h4 mb-0">Disponibilidade</h1>
                <p class="small text-muted mb-0" th:text="${clinica.ativa} ? 'A clínica está recebendo novas triagens.' : 'A clínica não aparece para os tutores ao registrar triagens.'">Status</p>
            </div>
            <form th:replace="~{fragments/componentes :: acao('/clinica/gerenciar/alternar',
                  ${clinica.ativa} ? 'Pausar novas triagens' : 'Voltar a receber triagens',
                  ${clinica.ativa} ? 'btn-outline-danger' : 'btn-outline-success',
                  ${clinica.ativa} ? 'bi-pause-circle' : 'bi-play-circle',
                  ${clinica.ativa} ? 'Pausar o recebimento de novas triagens?' : null)}"></form>
        </div>
    </div>
    <div class="card card-zelo p-4">
        <h2 class="h4 mb-3">Dados da clínica</h2>
        <form th:action="@{/clinica/gerenciar}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/campos :: errosGerais}"></div>
            <th:block th:replace="~{fragments/campos :: dadosClinica('')}"></th:block>
            <button type="submit" class="btn btn-zelo w-100">Salvar alterações</button>
        </form>
    </div>
</main>
</body>
</html>
