<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Minha clinica')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>

<main class="container" style="max-width: 640px;">
    <div class="card card-zelo p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Minha clinica</h3>
            <form th:action="@{/clinica/gerenciar/alternar}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm"
                        th:classappend="${clinica.isAtiva()} ? 'btn-outline-danger' : 'btn-outline-success'"
                        th:text="${clinica.isAtiva()} ? 'Marcar como indisponivel' : 'Reativar clinica'"></button>
            </form>
        </div>

        <form th:action="@{/clinica/gerenciar}" th:object="${form}" method="post" novalidate>
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" th:field="*{nome}" class="form-control" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">CNPJ</label>
                <input type="text" th:field="*{cnpj}" class="form-control" th:classappend="${#fields.hasErrors('cnpj')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" th:field="*{telefone}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Endereco</label>
                <input type="text" th:field="*{endereco}" class="form-control"/>
            </div>
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Cidade</label>
                    <input type="text" th:field="*{cidade}" class="form-control"/>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">UF</label>
                    <input type="text" th:field="*{estado}" maxlength="2" class="form-control" th:classappend="${#fields.hasErrors('estado')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                </div>
            </div>
            <button type="submit" class="btn btn-zelo w-100">Salvar alteracoes</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
