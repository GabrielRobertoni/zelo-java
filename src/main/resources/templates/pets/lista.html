<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Meus pets')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Meus pets</h2>
        <a th:href="@{/tutor/pets/novo}" class="btn btn-zelo">Cadastrar pet</a>
    </div>

    <p class="text-muted" th:if="${#lists.isEmpty(pets)}">Voce ainda nao cadastrou nenhum pet.</p>

    <div class="row g-3">
        <div class="col-md-4" th:each="pet : ${pets}">
            <div class="card card-zelo p-3 h-100">
                <h5 th:text="${pet.nome}">Nome</h5>
                <p class="mb-1"><strong>Especie:</strong> <span th:text="${pet.especie}"></span></p>
                <p class="mb-1" th:if="${pet.raca}"><strong>Raca:</strong> <span th:text="${pet.raca}"></span></p>
                <p class="mb-1" th:if="${pet.idadeAnos != null}"><strong>Idade:</strong> <span th:text="${pet.idadeAnos} + ' anos'"></span></p>
                <div class="mt-2 d-flex gap-2">
                    <a th:href="@{'/tutor/pets/' + ${pet.id} + '/editar'}" class="btn btn-sm btn-outline-secondary">Editar</a>
                    <form th:action="@{'/tutor/pets/' + ${pet.id} + '/excluir'}" method="post"
                          onsubmit="return confirm('Tem certeza que deseja remover este pet?');">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
