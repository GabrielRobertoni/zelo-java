<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${titulo}">Pet</title></head>
<body>
<main layout:fragment="conteudo" class="container pagina-media">
    <a th:href="@{/tutor/pets}" class="link-voltar"><i class="bi bi-arrow-left"></i> Meus pets</a>
    <div class="card card-zelo p-4">
        <h1 class="h3 mb-3 d-flex align-items-center gap-3"><span class="icone-tom " aria-hidden="true"><i class="bi bi-heart"></i></span> <span th:text="${titulo}">Pet</span></h1>
        <form th:action="@{${acao}}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/campos :: errosGerais}"></div>
            <div th:replace="~{fragments/campos :: entrada('nome', 'Nome', 'text', null)}"></div>
            <div class="row">
                <div class="col-md-6" th:insert="~{fragments/campos :: selecaoEnum('especie', 'Espécie', ${especies}, 'Selecione')}"></div>
                <div class="col-md-6" th:insert="~{fragments/campos :: selecaoEnum('sexo', 'Sexo', ${sexos}, 'Não informado')}"></div>
            </div>
            <div th:replace="~{fragments/campos :: entrada('raca', 'Raça (opcional)', 'text', null)}"></div>
            <div class="row">
                <div class="col-md-6" th:insert="~{fragments/campos :: entrada('dataNascimento', 'Data de nascimento', 'date', null)}"></div>
                <div class="col-md-6" th:insert="~{fragments/campos :: entrada('pesoKg', 'Peso (kg)', 'number', null)}"></div>
            </div>
            <div th:replace="~{fragments/campos :: marcador('castrado', 'Castrado(a)')}"></div>
            <button type="submit" class="btn btn-zelo w-100">Salvar</button>
        </form>
    </div>
</main>
</body>
</html>
