<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${titulo})}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container" style="max-width: 640px;">
    <div class="card card-zelo p-4">
        <h3 class="mb-3" th:text="${titulo}">Pet</h3>

        <form th:action="@{${acao}}" th:object="${form}" method="post" novalidate>
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" th:field="*{nome}" class="form-control" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Especie</label>
                    <select th:field="*{especie}" class="form-select" th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid'">
                        <option value="">Selecione</option>
                        <option th:each="e : ${especies}" th:value="${e}" th:text="${e}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sexo</label>
                    <select th:field="*{sexo}" class="form-select">
                        <option value="">Nao informado</option>
                        <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Raca</label>
                <input type="text" th:field="*{raca}" class="form-control" th:classappend="${#fields.hasErrors('raca')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('raca')}" th:errors="*{raca}"></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Data de nascimento</label>
                    <input type="date" th:field="*{dataNascimento}" class="form-control" th:classappend="${#fields.hasErrors('dataNascimento')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Peso (kg)</label>
                    <input type="number" step="0.01" th:field="*{pesoKg}" class="form-control" th:classappend="${#fields.hasErrors('pesoKg')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('pesoKg')}" th:errors="*{pesoKg}"></div>
                </div>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{castrado}" class="form-check-input"/>
                <label class="form-check-label">Castrado(a)</label>
            </div>
            <button type="submit" class="btn btn-zelo w-100">Salvar</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
