<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Cadastro de veterinário</title></head>
<body>
<main layout:fragment="conteudo" class="container pagina-media">
    <a th:href="@{/registro}" class="link-voltar"><i class="bi bi-arrow-left"></i> Trocar perfil</a>
    <div class="card card-zelo p-4">
        <h1 class="h3 mb-1 d-flex align-items-center gap-3"><span class="icone-tom tom-azul" aria-hidden="true"><i class="bi bi-clipboard2-pulse"></i></span> Criar conta de veterinário</h1>
        <p class="text-muted mb-4">O código de convite garante que só a equipe da clínica veja os dados dos pacientes.
            Peça o código ao gestor (ele aparece em <em>Minha clínica &gt; Equipe</em>).</p>
        <form th:action="@{/registro/veterinario}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/campos :: errosGerais}"></div>
            <div th:replace="~{fragments/campos :: entrada('codigoConvite', 'Código de convite da clínica', 'text', 'Clínica de demonstração: AMIGA2026')}"></div>
            <th:block th:replace="~{fragments/campos :: dadosAcesso}"></th:block>
            <button type="submit" class="btn btn-zelo w-100">Criar conta e entrar na equipe</button>
        </form>
    </div>
</main>
</body>
</html>
