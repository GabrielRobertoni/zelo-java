<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Cadastro de gestor</title></head>
<body>
<main layout:fragment="conteudo" class="container pagina-media">
    <a th:href="@{/registro}" class="link-voltar"><i class="bi bi-arrow-left"></i> Trocar perfil</a>
    <div class="card card-zelo p-4">
        <h1 class="h3 mb-1 d-flex align-items-center gap-3"><span class="icone-tom tom-atencao" aria-hidden="true"><i class="bi bi-hospital"></i></span> Cadastrar minha clínica</h1>
        <p class="text-muted mb-4">Você será o gestor da clínica e receberá um código de convite para a sua equipe.</p>
        <form th:action="@{/registro/gestor}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/campos :: errosGerais}"></div>
            <h2 class="h6 secao-formulario">Seus dados de acesso</h2>
            <th:block th:replace="~{fragments/campos :: dadosAcesso}"></th:block>
            <h2 class="h6 secao-formulario">Dados da clínica</h2>
            <th:block th:replace="~{fragments/campos :: dadosClinica('clinica.')}"></th:block>
            <button type="submit" class="btn btn-zelo w-100">Cadastrar clínica e criar conta</button>
        </form>
    </div>
</main>
</body>
</html>
