<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${titulo}">Alerta</title></head>
<body>
<main layout:fragment="conteudo" class="container pagina-media">
    <a th:href="@{${voltar}}" class="link-voltar"><i class="bi bi-arrow-left"></i> Voltar</a>
    <div class="card card-zelo p-4">
        <h1 class="h3 mb-3 d-flex align-items-center gap-3"><span class="icone-tom tom-azul" aria-hidden="true"><i class="bi bi-calendar-plus"></i></span> <span th:text="${titulo}">Alerta</span></h1>
        <th:block th:if="${#lists.isEmpty(pets)}">
            <div class="alert alert-info mb-0">Não há pets disponíveis. Para o tutor: cadastre um pet. Para a clínica:
                um pet passa a ser paciente quando o tutor envia uma triagem para ela.</div>
        </th:block>
        <form th:unless="${#lists.isEmpty(pets)}" th:action="@{${acao}}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/campos :: errosGerais}"></div>
            <div class="row">
                <div class="col-md-6" th:insert="~{fragments/campos :: selecaoEntidade('petId', 'Pet', ${pets}, 'Selecione o pet')}"></div>
                <div class="col-md-6" th:insert="~{fragments/campos :: selecaoEnum('tipoAlerta', 'Tipo de cuidado', ${tiposAlerta}, 'Selecione')}"></div>
            </div>
            <div th:replace="~{fragments/campos :: entrada('titulo', 'Título', 'text', 'Ex.: Reforço da vacina V10')}"></div>
            <div th:replace="~{fragments/campos :: texto('mensagem', 'Orientação (opcional)', 3, 'Detalhes que ajudam o tutor a cumprir o cuidado.')}"></div>
            <div th:replace="~{fragments/campos :: entrada('dataPrevista', 'Data prevista', 'date', null)}"></div>
            <button type="submit" class="btn btn-zelo w-100">Salvar</button>
        </form>
    </div>
</main>
</body>
</html>
