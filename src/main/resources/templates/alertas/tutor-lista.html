<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Plano de cuidado')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/mensagens :: mensagens}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Plano de cuidado (Ciclo Zelo)</h2>
        <a th:href="@{/tutor/alertas/novo}" class="btn btn-zelo">Novo lembrete</a>
    </div>

    <p class="text-muted" th:if="${#lists.isEmpty(alertas)}">Nenhum cuidado pendente. Tudo em dia!</p>

    <div class="row g-3">
        <div class="col-md-6" th:each="a : ${alertas}">
            <div class="card card-zelo p-3 h-100">
                <div class="d-flex justify-content-between">
                    <h5 th:text="${a.titulo}">Titulo</h5>
                    <span class="badge text-bg-secondary" th:text="${a.statusAlerta}"></span>
                </div>
                <p class="small text-muted mb-1">
                    <span th:text="${a.pet.nome}">Pet</span> ·
                    <span th:text="${a.tipoAlerta}"></span> ·
                    previsto para <span th:text="${#temporals.format(a.dataPrevista, 'dd/MM/yyyy')}"></span>
                </p>
                <p th:if="${a.mensagem}" th:text="${a.mensagem}">Mensagem</p>
                <p class="small text-muted" th:if="${a.clinica != null}">Recomendado por: <span th:text="${a.clinica.nome}"></span></p>
                <div class="d-flex gap-2 mt-2">
                    <form th:action="@{'/tutor/alertas/' + ${a.id} + '/confirmar'}" method="post">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-zelo">Confirmar realizado</button>
                    </form>
                    <form th:action="@{'/tutor/alertas/' + ${a.id} + '/cancelar'}" method="post">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
