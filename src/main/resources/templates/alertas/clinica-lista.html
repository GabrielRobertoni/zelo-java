<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Alertas da clínica</title></head>
<body>
<main layout:fragment="conteudo" class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div th:replace="~{fragments/componentes :: cabecalho('Alertas da clínica', 'Cuidados recomendados aos pacientes. Envie o lembrete e acompanhe a confirmação do tutor.')}"></div>
        <a th:href="@{/clinica/alertas/novo}" class="btn btn-zelo"><i class="bi bi-calendar-plus"></i> Recomendar cuidado</a>
    </div>

    <ul class="nav nav-pills abas my-3">
        <li class="nav-item"><a class="nav-link" th:classappend="${aba == 'abertos'} ? 'active'" th:href="@{/clinica/alertas}">
            <i class="bi bi-hourglass-split"></i> Em aberto</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${aba == 'historico'} ? 'active'" th:href="@{/clinica/alertas(aba='historico')}">
            <i class="bi bi-archive"></i> Histórico</a></li>
    </ul>

    <th:block th:if="${#lists.isEmpty(alertas)}">
        <div class="card card-zelo p-4">
            <div th:replace="~{fragments/componentes :: vazio('bi-bell-slash', 'Nenhum alerta nesta aba.')}"></div>
        </div>
    </th:block>

    <div class="table-responsive" th:unless="${#lists.isEmpty(alertas)}">
        <table class="table table-hover align-middle bg-white">
            <thead><tr><th>Previsto para</th><th>Paciente</th><th>Cuidado</th><th>Tipo</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="a : ${alertas}" th:classappend="${a.atrasado} ? 'linha-atrasada'">
                <td class="text-nowrap" th:text="${#temporals.format(a.dataPrevista, 'dd/MM/yyyy')}">Data</td>
                <td><a th:href="@{'/clinica/pacientes/' + ${a.pet.id}}" th:text="${a.pet.nome}">Pet</a></td>
                <td th:text="${a.titulo}">Título</td>
                <td th:text="${a.tipoAlerta.rotulo}">Tipo</td>
                <td><span th:replace="~{fragments/componentes :: statusAlerta(${a})}"></span></td>
                <td class="text-end text-nowrap">
                    <th:block th:if="${a.statusAlerta.name() == 'PENDENTE'}">
                        <form th:replace="~{fragments/componentes :: acao('/clinica/alertas/' + ${a.id} + '/enviar', 'Enviar lembrete', 'btn-zelo', 'bi-send', null)}"></form>
                    </th:block>
                    <th:block th:if="${a.statusAlerta.aberto}">
                        <form th:replace="~{fragments/componentes :: acao('/clinica/alertas/' + ${a.id} + '/cancelar', 'Cancelar', 'btn-outline-danger', 'bi-x-lg', 'Cancelar este alerta?')}"></form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
