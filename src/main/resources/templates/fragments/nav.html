<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-zelo sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-heart-pulse-fill"></i> Zelo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navZelo">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navZelo">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="hasRole('TUTOR')">
                    <a class="nav-link" th:href="@{/tutor/dashboard}"><i class="bi bi-speedometer2"></i> Painel</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('TUTOR')">
                    <a class="nav-link" th:href="@{/tutor/pets}"><i class="bi bi-egg-fill"></i> Meus pets</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('TUTOR')">
                    <a class="nav-link" th:href="@{/tutor/triagens}"><i class="bi bi-clipboard2-pulse"></i> Triagens</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('TUTOR')">
                    <a class="nav-link" th:href="@{/tutor/alertas}"><i class="bi bi-calendar-heart"></i> Plano de cuidado</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('VETERINARIO','GESTOR')">
                    <a class="nav-link" th:href="@{/clinica/dashboard}"><i class="bi bi-speedometer2"></i> Painel</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('VETERINARIO','GESTOR')">
                    <a class="nav-link" th:href="@{/clinica/triagens}"><i class="bi bi-list-check"></i> Fila de atencao</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('VETERINARIO','GESTOR')">
                    <a class="nav-link" th:href="@{/clinica/alertas}"><i class="bi bi-bell-fill"></i> Alertas</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('GESTOR')">
                    <a class="nav-link" th:href="@{/clinica/gerenciar}"><i class="bi bi-hospital"></i> Minha clinica</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-lg-center gap-lg-2">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link disabled nav-user"><i class="bi bi-person-circle"></i> <span sec:authentication="name">usuario</span></span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-nav-outline">Sair</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Entrar</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/registro}" class="btn btn-sm btn-nav-primary">Criar conta</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
