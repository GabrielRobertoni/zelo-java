<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Minhas triagens</title></head>
<body>
<main layout:fragment="conteudo" class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div th:replace="~{fragments/componentes :: cabecalho('Minhas triagens', 'Acompanhe a classificação e o andamento de cada caso.')}"></div>
        <a th:href="@{/tutor/triagens/nova}" class="btn btn-zelo"><i class="bi bi-clipboard2-pulse"></i> Registrar triagem</a>
    </div>

    <th:block th:if="${#lists.isEmpty(triagens)}">
        <div class="card card-zelo p-4">
            <div th:replace="~{fragments/componentes :: vazio('bi-clipboard2', 'Você ainda não registrou nenhuma triagem.')}"></div>
        </div>
    </th:block>

    <div class="table-responsive" th:unless="${#lists.isEmpty(triagens)}">
        <table class="table table-hover align-middle bg-white">
            <thead>
            <tr><th>Data</th><th>Pet</th><th>Clínica</th><th>Urgência</th><th>Status</th><th>Relato</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${triagens}">
                <td class="text-nowrap" th:text="${#temporals.format(t.criadaEm, 'dd/MM/yyyy HH:mm')}">Data</td>
                <td><a th:href="@{'/tutor/pets/' + ${t.pet.id}}" th:text="${t.pet.nome}">Pet</a></td>
                <td th:text="${t.clinica != null ? t.clinica.nome : '-'}">Clínica</td>
                <td><span th:replace="~{fragments/componentes :: urgencia(${t.nivelUrgencia})}"></span>
                    <span class="small text-muted d-block" th:text="'score ' + ${t.scoreRisco.stripTrailingZeros().toPlainString()}">score</span></td>
                <td><span th:replace="~{fragments/componentes :: statusTriagem(${t.statusTriagem})}"></span></td>
                <td class="small" th:text="${#strings.abbreviate(t.relato, 70)}">Relato</td>
                <td class="text-end">
                    <th:block th:if="${t.statusTriagem.name() == 'ABERTA'}">
                        <form th:replace="~{fragments/componentes :: acao('/tutor/triagens/' + ${t.id} + '/cancelar', 'Cancelar', 'btn-outline-danger', 'bi-x-lg', 'Cancelar esta triagem?')}"></form>
                    </th:block>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
