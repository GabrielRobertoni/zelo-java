<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Fila de atenção</title></head>
<body>
<main layout:fragment="conteudo" class="container">
    <div th:replace="~{fragments/componentes :: cabecalho('Triagens da clínica', 'A fila é ordenada pela urgência e, no empate, pela ordem de chegada.')}"></div>

    <ul class="nav nav-pills abas my-3">
        <li class="nav-item"><a class="nav-link" th:classappend="${aba == 'fila'} ? 'active'" th:href="@{/clinica/triagens}">
            <i class="bi bi-list-check"></i> Fila de atenção</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${aba == 'historico'} ? 'active'" th:href="@{/clinica/triagens(aba='historico')}">
            <i class="bi bi-archive"></i> Histórico</a></li>
    </ul>

    <th:block th:if="${#lists.isEmpty(triagens)}">
        <div class="card card-zelo p-4">
            <div th:replace="~{fragments/componentes :: vazio('bi-emoji-smile', ${aba == 'fila'} ? 'Nenhuma triagem aguardando atenção no momento.' : 'Nenhuma triagem finalizada ainda.')}"></div>
        </div>
    </th:block>

    <div class="row g-3">
        <div class="col-md-6" th:each="t, iteracao : ${triagens}">
            <article class="card card-zelo card-triagem p-3 h-100" th:classappend="'borda-' + ${t.nivelUrgencia.name()}">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <span class="posicao-fila" th:if="${aba == 'fila'}" th:text="${iteracao.count} + 'º'">1º</span>
                        <h2 class="h5 d-inline mb-0"><a th:href="@{'/clinica/pacientes/' + ${t.pet.id}}" th:text="${t.pet.nome}">Pet</a></h2>
                        <div class="small text-muted" th:if="${t.tutor != null}"
                             th:text="'Tutor: ' + ${t.tutor.usuario.nome} + (${t.tutor.telefone} != null ? ' · ' + ${t.tutor.telefone} : '')">Tutor</div>
                    </div>
                    <span th:replace="~{fragments/componentes :: urgencia(${t.nivelUrgencia})}"></span>
                </div>
                <p class="small text-muted my-2">
                    Score <strong th:text="${t.scoreRisco.stripTrailingZeros().toPlainString()}">0</strong> ·
                    <span th:text="${#temporals.format(t.criadaEm, 'dd/MM HH:mm')}">data</span> ·
                    <span th:replace="~{fragments/componentes :: statusTriagem(${t.statusTriagem})}"></span>
                </p>
                <p class="relato mb-3" th:text="${t.relato}">Relato</p>
                <div class="d-flex flex-wrap gap-2 mt-auto" th:if="${t.statusTriagem.emAndamento}">
                    <th:block th:if="${t.statusTriagem.name() == 'ABERTA'}">
                        <form th:replace="~{fragments/componentes :: acao('/clinica/triagens/' + ${t.id} + '/encaminhar', 'Encaminhar para atendimento', 'btn-zelo', 'bi-arrow-right-circle', null)}"></form>
                    </th:block>
                    <form th:replace="~{fragments/componentes :: acao('/clinica/triagens/' + ${t.id} + '/concluir', 'Concluir atendimento', 'btn-outline-success', 'bi-check2', null)}"></form>
                    <form th:replace="~{fragments/componentes :: acao('/clinica/triagens/' + ${t.id} + '/cancelar', 'Cancelar', 'btn-outline-danger', 'bi-x-lg', 'Cancelar esta triagem? O tutor verá o status cancelado.')}"></form>
                </div>
                <div class="d-flex gap-2 mt-auto" th:unless="${t.statusTriagem.emAndamento}">
                    <a th:href="@{'/clinica/alertas/novo?petId=' + ${t.pet.id}}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-calendar-plus"></i> Recomendar cuidado</a>
                </div>
            </article>
        </div>
    </div>
</main>
</body>
</html>
